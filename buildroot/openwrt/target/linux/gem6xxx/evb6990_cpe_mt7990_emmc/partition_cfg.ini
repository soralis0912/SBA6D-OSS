[GENERAL]
; ab_layout = True: using AB layout, otherwise using non-AB layout
ab_layout = True
[Partition_Exist]
; [partition name] = Y: keep partition into layout
; [partition name] = N: remove partition from layout
; only different settings from csv default setttings need configuration here.
; We accept partition name in forms of
; 1) full partition name
; 2) base partition name without _a/_b suffix
; 3) regular expression operations
; The following are some examples,
; para = N, remove para partition
; tee2 = N, remove tee2 partition
; tee_a = N, remove tee_a partition
; tee_b = N, remove tee_b partition
; tee = N, remove tee1/tee2/tee_a/tee_b partitions
; ^tee([12]|_[ab])$ = N, remove tee1/tee2/tee_a/tee_b partitions
